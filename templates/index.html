<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MoodSync — AI Music Recommender</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 to-indigo-900 text-white flex items-center justify-center">
  <div class="max-w-3xl mx-auto py-10 px-4 w-full">
    <h1 class="text-4xl font-extrabold mb-3 text-emerald-400 text-center">🎵 MoodSync</h1>
    <p class="text-slate-300 mb-8 text-center text-lg">AI-powered Music Recommendations based on your Mood & Language</p>

    <form action="/" method="POST" enctype="multipart/form-data" class="bg-white/10 backdrop-blur-md p-6 rounded-2xl space-y-6 shadow-xl border border-white/10">
      
      <div>
        <label class="block mb-2 font-medium">📸 Upload a face image (optional)</label>
        <input type="file" name="face_image" accept="image/*" 
          class="block w-full text-sm text-slate-200 bg-slate-800 border border-slate-700 rounded-lg p-2 focus:ring-2 focus:ring-emerald-400">
        <p class="text-xs text-slate-400 mt-2">We'll detect your mood from facial expression if provided.</p>
      </div>

      <div>
        <label class="block mb-2 font-medium">💬 Or describe how you feel (optional)</label>
        <textarea name="user_text" placeholder="e.g., I'm feeling excited and energetic!" 
          class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white"></textarea>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block mb-2 font-medium">🌐 Preferred Language</label>
          <select name="language" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white">
            <option value="">Any</option>
            <option value="English">English</option>
            <option value="Hindi">Hindi</option>
            <option value="Spanish">Spanish</option>
            <option value="Korean">Korean</option>
          </select>
        </div>

        <div>
          <label class="block mb-2 font-medium">🎭 Manual Mood (fallback)</label>
          <select name="mood" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white">
            <option value="Happy">Happy</option>
            <option value="Sad">Sad</option>
            <option value="Energetic">Energetic</option>
            <option value="Calm">Calm</option>
          </select>
        </div>
      </div>

      <button class="w-full bg-emerald-500 hover:bg-emerald-600 transition rounded-xl py-3 font-semibold text-lg">
        🎶 Get Recommendations
      </button>
    </form>

    <footer class="mt-10 text-xs text-slate-400 text-center">Made with ❤️ by Team MoodSync — ML Course Project</footer>
  </div>
</body>
</html>
